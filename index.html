<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=Showcases/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blender2Three-MCP — Redirecting to Showcase Portal</title>
  <style>
    body {
      background: #07090e;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(15, 20, 32, 0.9);
      border: 1px solid #1e2638;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 480px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
    }
  </style>
  <script>
    window.location.replace("Showcases/");
  </script>
</head>
<body>
  <div class="card">
    <h1>🎬 Blender2Three-MCP</h1>
    <p>Redirecting you to the unified interactive visual parity showcase portal...</p>
    <a href="Showcases/" class="btn">Click here if not redirected automatically</a>
  </div>
</body>
</html>
